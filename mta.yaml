_schema-version: 3.3.0
ID: claima-backend-test
version: 1.0.0
description: "EPF eClaim Application - Budget API Test"
parameters:
  enable-parallel-deployments: true
  deploy_mode: html5-repo
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - mkdir -p resources
modules:
  # ---------------- CAP backend (test) ----------------
  - name: claima-backend-srv-test
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api-test
        properties:
          srv-url: ${default-url}
    requires:
      - name: claima-backend-auth
      - name: claima-backend-db
      - name: claima-backend-connectivity
      - name: claima-backend-destination

  # NOTE: db-deployer removed on purpose.
  # The test app shares claima-backend-db with the main app.

  # ---------------- Approuter (test) ----------------
  - name: claima-backend-test
    type: approuter.nodejs
    path: app/router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api-test
        group: destinations
        properties:
          name: srv-api # must match xs-app.json
          url: ~{srv-url}
          forwardAuthToken: true
      - name: claima-backend-auth
      - name: claima-backend-html5-runtime
      - name: claima-backend-destination

  # ---------------- UI build (test) ----------------
  - name: claimabackendClaimA-test
    type: html5
    path: app/Claim-A
    build-parameters:
      build-result: dist
      builder: custom
      commands:
        - npm ci
        - npm run build
      supported-platforms: []

  # ---------------- Destination content (test) ----------------
  - name: claima-backend-destinations-test
    type: com.sap.application.content
    requires:
      - name: claima-backend-auth
        parameters:
          service-key:
            name: claima-backend-auth-key-test
      - name: claima-backend-html5-repo-host-test
        parameters:
          service-key:
            name: claima-backend-html5-repo-host-key-test
      - name: claima-backend-destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: claima-backend-html5-repository-test
              ServiceInstanceName: claima-backend-html5-repo-host-test
              ServiceKeyName: claima-backend-html5-repo-host-key-test
              sap.cloud.service: claimabackend-test.service
            - Name: claima-backend-auth-test
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: claima-backend-auth
              ServiceKeyName: claima-backend-auth-key-test
              sap.cloud.service: claimabackend-test.service

  # ---------------- UI deployer (test) ----------------
  - name: claima-backend-app-deployer-test
    type: com.sap.application.content
    path: app
    requires:
      - name: claima-backend-auth
      - name: srv-api-test
      - name: claima-backend-html5-repo-host-test
        parameters:
          content-target: true
          config:
            HTML5Runtime_enabled: true
    build-parameters:
      build-result: app/
      requires:
        - name: claimabackendClaimA-test
          artifacts:
            - Claim-A.zip
          target-path: app/
    parameters:
      config:
        destinations:
          - name: srv-api
            url: ~{srv-api-test/srv-url}
            forwardAuthToken: true
          - name: ui5
            url: https://ui5.sap.com

resources:
  # Shared - owned by main MTA. Test MTA will NOT change its config.
  - name: claima-backend-auth
    type: org.cloudfoundry.existing-service

  - name: claima-backend-db
    type: org.cloudfoundry.existing-service

  - name: claima-backend-connectivity
    type: org.cloudfoundry.existing-service

  - name: claima-backend-destination
    type: org.cloudfoundry.existing-service

  - name: claima-backend-html5-runtime
    type: org.cloudfoundry.existing-service

  # Test-only - separate UI repository so UIs don't overwrite each other
  - name: claima-backend-html5-repo-host-test
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host
